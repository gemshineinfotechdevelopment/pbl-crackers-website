# ==============================================================================
# Nginx Configuration for PBL Crackers
# Domain: pbl-crackers.gemshine.tech
# Frontend Root: /var/www/pbl-crackers/dist (Vite React SPA)
# Backend API:   http://127.0.0.1:5019 (Express Node.js Server via PM2)
# ==============================================================================

server {
    listen 80;
    listen [::]:80;
    server_name pbl-crackers.gemshine.tech;

    # Frontend React SPA build directory (Matches VPS folder)
    root /var/www/pbl-crackers-website/dist;
    index index.html;

    # Maximum file upload size (Allows bulk Excel imports, high-res cracker images)
    client_max_body_size 50M;

    # Gzip Compression for fast page speed
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/x-javascript
        application/xml
        application/javascript
        application/json
        image/svg+xml;
    gzip_disable "MSIE [1-6]\.";

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;

    # Frontend React SPA Route Handling
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Static Assets Caching (Vite hashed bundles)
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, no-transform, immutable";
    }

    # Static Uploads Proxy (images uploaded to backend disk)
    location /uploads/ {
        proxy_pass http://127.0.0.1:5019/uploads/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Backend API Reverse Proxy to Port 5019
    location /api/ {
        proxy_pass http://127.0.0.1:5019/api/;
        proxy_http_version 1.1;
        
        # WebSockets & Connection headers
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;

        # Timeout settings for heavy processing (bulk Excel product imports, large uploads)
        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }

    # Direct Health Check Route
    location /health {
        proxy_pass http://127.0.0.1:5019/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # Custom Error Pages
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
